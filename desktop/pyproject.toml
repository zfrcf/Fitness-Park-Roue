[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier"
version = "1.1.0"
description = "Atelier IA local : chat de développement dans le terminal, fichiers écrits sur le disque, compilation locale avec gradle build."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atelier = "atelier.cli:main"

[tool.setuptools.packages.find]
include = ["atelier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
